services:
  # ============================================================================
  # 1. Python FastAPI AI & RAG Microservice
  # ============================================================================
  - type: web
    name: nyayaflow-ai-service
    runtime: python
    region: singapore
    plan: free
    rootDir: ai-service
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn app.main:app --host 0.0.0.0 --port $PORT
    healthCheckPath: /health
    autoDeploy: false
    envVars:
      - key: PYTHON_VERSION
        value: 3.10.13
      - key: LLM_PROVIDER
        value: groq
      - key: GROQ_MODEL
        value: openai/gpt-oss-120b
      - key: GROQ_BASE_URL
        value: https://api.groq.com/openai/v1
      - key: GROQ_API_KEY
        sync: false
      - key: DATABASE_URL
        sync: false
      - key: EMBEDDING_MODEL_NAME
        value: deterministic-feature-hashing-384
      - key: EMBEDDING_DIMENSION
        value: 384

  # ============================================================================
  # 2. Node.js Express Core Backend
  # ============================================================================
  - type: web
    name: nyayaflow-backend
    runtime: node
    region: singapore
    plan: free
    rootDir: backend
    buildCommand: npm install
    startCommand: npm start
    healthCheckPath: /health
    autoDeploy: false
    envVars:
      - key: NODE_VERSION
        value: 20.11.0
      - key: NODE_ENV
        value: production
      - key: CORS_ORIGIN
        value: "*"
      - key: DATABASE_URL
        sync: false
      - key: AI_SERVICE_URL
        sync: false
      - key: JWT_SECRET
        sync: false
      - key: JWT_EXPIRES_IN
        value: 7d
      - key: SUPABASE_URL
        sync: false
      - key: SUPABASE_SERVICE_ROLE_KEY
        sync: false
      - key: MAX_FILE_SIZE_MB
        value: 50

